name: Build Flutter Windows App

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Visual Studio
      uses: microsoft/setup-msbuild@v2
      with:
        vs-version: '17.0'
    
    - name: Install Flutter
      run: |
        git clone https://github.com/flutter/flutter.git --depth 1 -b stable C:\flutter
        echo "C:\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    
    - name: Flutter doctor
      run: flutter doctor -v
      continue-on-error: true
    
    - name: Enable Windows desktop
      run: flutter config --enable-windows-desktop
    
    - name: Clean project
      run: |
        flutter clean
        Remove-Item -Recurse -Force -ErrorAction SilentlyContinue windows/build
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build Windows app
      run: flutter build windows --release
      env:
        VSWHERE_PATH: "C:\\Program Files (x86)\\Microsoft Visual Studio\\Installer\\vswhere.exe"
