name: Build Flutter Windows App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Install Flutter manually
      run: |
        git clone https://github.com/flutter/flutter.git --depth 1 -b stable C:\flutter
        echo "C:\flutter\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
    
    - name: Check Flutter installation
      run: flutter --version
    
    - name: Enable Windows desktop support
      run: flutter config --enable-windows-desktop
    
    - name: Get dependencies
      run: flutter pub get
    
    - name: Build Windows executable
      run: flutter build windows --release
    
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: windows-release
        path: build/windows/x64/runner/Release/
